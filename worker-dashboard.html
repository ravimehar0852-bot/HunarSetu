
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Dashboard - HunarSetu</title>
  <link rel="stylesheet" href="./styles.css">

  <style>
    .worker-dashboard {
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .dashboard-header h1 {
      margin: 0;
    }

    .dashboard-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: #166534;
      color: white;
      text-decoration: none;
      display: inline-block;
    }

    .dashboard-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .booking-list {
      display: grid;
      gap: 16px;
    }

    .booking-card {
      background: var(--card, #fff);
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 20px;
      overflow-wrap: anywhere;
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .booking-card h2 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .booking-card p {
      margin: 9px 0;
      line-height: 1.5;
    }

    .booking-status {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 700;
      background: #f3f4f6;
      color: #374151;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-rejected {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .message-box,
    .empty-state {
      padding: 22px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: var(--card, #fff);
      text-align: center;
    }

    .booking-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .booking-actions button {
      border: 0;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .worker-dashboard {
        padding: 12px;
      }

      .booking-card {
        padding: 16px;
      }

      .dashboard-header {
        align-items: stretch;
      }

      .dashboard-header .dashboard-btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="worker-dashboard">

    <header class="dashboard-header">
      <div>
        <h1>Worker Dashboard</h1>
        <p>Manage your service booking requests.</p>
      </div>

      <button id="refreshBtn" class="dashboard-btn" type="button">
        Refresh
      </button>
    </header>

    <div id="message" class="message-box" role="status">
      Checking your account...
    </div>

    <section id="bookingList" class="booking-list"></section>

    <p style="margin-top:24px;">
      <a href="./workers.html">← Find Workers</a>
      &nbsp; | &nbsp;
      <a href="./index.html">Home</a>
    </p>

  </main>

  <script type="module">
    import {
      auth,
      db,
      A,
      F,
      getRole
    } from "./app.js";

    const message = document.getElementById("message");
    const bookingList = document.getElementById("bookingList");
    const refreshBtn = document.getElementById("refreshBtn");

    let currentUser = null;
    let requestNumber = 0;

    function showMessage(text) {
      message.replaceChildren();
      message.textContent = text;
      message.hidden = false;
    }

    function formatDate(value) {
      if (!value) return "Not available";

      if (typeof value === "string") {
        const parts = value.split("-");

        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        return value;
      }

      const date = typeof value.toDate === "function"
        ? value.toDate()
        : new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Not available";
      }

      return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    function createBookingCard(booking) {
      const card = document.createElement("article");
      card.className = "booking-card";

      const top = document.createElement("div");
      top.className = "booking-top";

      const heading = document.createElement("div");

      addText(
        heading,
        "h2",
        booking.customerName || "Customer"
      );

      addText(
        heading,
        "p",
        "Booking for: " + (booking.workerSkill || "Your service")
      );

      const statusValue = booking.status || "pending";
      const status = document.createElement("span");

      status.className =
        "booking-status status-" + statusValue;

      status.textContent =
        statusValue.charAt(0).toUpperCase() +
        statusValue.slice(1);

      top.append(heading, status);
      card.appendChild(top);

      addText(
        card,
        "p",
        "Service date: " + formatDate(booking.serviceDate)
      );

      addText(
        card,
        "p",
        "Customer phone: " + (booking.phone || "Not provided")
      );

      addText(
        card,
        "p",
        "Customer email: " + (booking.customerEmail || "Not provided")
      );

      addText(
        card,
        "p",
        "Address: " + (booking.address || "Not provided")
      );

      addText(
        card,
        "p",
        "Work details: " + (booking.description || "Not provided")
      );

      addText(
        card,
        "p",
        "Requested on: " + formatDate(booking.createdAt),
        "muted"
      );

      const actions = document.createElement("div");
      actions.className = "booking-actions";

      if (booking.phone) {
        const call = document.createElement("a");
        call.className = "dashboard-btn";
        call.href = "tel:" + booking.phone;
        call.textContent = "Call Customer";
        actions.appendChild(call);

        const whatsapp = document.createElement("a");
        const number = booking.phone.replace(/\D/g, "");

        whatsapp.className = "dashboard-btn";
        whatsapp.href = "https://wa.me/" + number;
        whatsapp.target = "_blank";
        whatsapp.rel = "noopener noreferrer";
        whatsapp.textContent = "WhatsApp";

        actions.appendChild(whatsapp);
      }

      if (booking.status === "pending" ||
          booking.status === "confirmed") {
        const completeButton = document.createElement("button");
        completeButton.type = "button";
        completeButton.className = "dashboard-btn";
        completeButton.textContent = "Mark Completed";

        completeButton.addEventListener("click", () => {
          updateBookingStatus(booking.id, "completed");
        });

        actions.appendChild(completeButton);
      }

      if (actions.childElementCount > 0) {
        card.appendChild(actions);
      }

      return card;
    }

    async function loadBookings(user) {
      const thisRequest = ++requestNumber;

      refreshBtn.disabled = true;
      refreshBtn.textContent = "Loading...";
      bookingList.replaceChildren();
      showMessage("Loading your bookings...");

      try {
        const bookingsQuery = F.query(
          F.collection(db, "bookings"),
          F.where("workerUid", "==", user.uid)
        );

        const snapshot = await F.getDocs(bookingsQuery);

        if (thisRequest !== requestNumber) return;

        if (snapshot.empty) {
          showMessage("You don't have any booking requests yet.");

          const empty = document.createElement("div");
          empty.className = "empty-state";

          addText(
            empty,
            "p",
            "When a customer books your service, the request will appear here."
          );

          bookingList.appendChild(empty);
          return;
        }

        const bookings = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        bookings.sort((a, b) => {
          const timeA = a.createdAt?.toMillis?.() || 0;
          const timeB = b.createdAt?.toMillis?.() || 0;
          return timeB - timeA;
        });

        message.hidden = true;

        bookings.forEach(booking => {
          bookingList.appendChild(createBookingCard(booking));
        });

      } catch (error) {
        console.error("Worker bookings error:", error);

        if (thisRequest === requestNumber) {
          showMessage(
            error.code === "permission-denied"
              ? "Permission denied. Please check your Firestore booking rules."
              : "Could not load bookings. Please check your connection."
          );
        }

      } finally {
        if (thisRequest === requestNumber) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = "Refresh";
        }
      }
    }

    async function updateBookingStatus(bookingId, nextStatus) {
      if (!currentUser) return;

      const confirmed = window.confirm(
        "Mark this booking as completed?"
      );

      if (!confirmed) return;

      try {
        const bookingRef = F.doc(db, "bookings", bookingId);
        const bookingSnap = await F.getDoc(bookingRef);

        if (!bookingSnap.exists()) {
          alert("Booking not found.");
          return;
        }

        const booking = bookingSnap.data();

        if (booking.workerUid !== currentUser.uid) {
          alert("You can only update your own bookings.");
          return;
        }

        if (!["pending", "confirmed"].includes(booking.status)) {
          alert("This booking can no longer be marked completed.");
          return;
        }

        await F.updateDoc(bookingRef, {
          status: nextStatus
        });

        alert("Booking marked as completed.");
        await loadBookings(currentUser);

      } catch (error) {
        console.error(error);

        alert(
          error.code === "permission-denied"
            ? "You don't have permission to update this booking. Only admin can change booking status right now."
            : "Could not update booking. Please try again."
        );
      }
    }

    async function checkAccount(user) {
      currentUser = user;

      if (!user) {
        showMessage("Please log in with your worker account.");

        const link = document.createElement("a");
        link.href = "./login.html";
        link.className = "dashboard-btn";
        link.textContent = "Login";

        message.append(
          document.createElement("br"),
          document.createElement("br"),
          link
        );

        bookingList.replaceChildren();
        refreshBtn.disabled = true;
        return;
      }

      try {
        const role = await getRole(user);

        if (role !== "worker") {
          showMessage(
            "This dashboard is only for worker accounts. Please log in with your worker account."
          );

          bookingList.replaceChildren();
          refreshBtn.disabled = true;
          return;
        }

        await loadBookings(user);

      } catch (error) {
        console.error(error);
        showMessage("Could not verify your account. Please try again.");
      }
    }

    refreshBtn.addEventListener("click", () => {
      if (currentUser) {
        checkAccount(currentUser);
      }
    });

    A.onAuthStateChanged(auth, checkAccount);
  </script>
</body>
</html>
