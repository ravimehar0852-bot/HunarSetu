<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — HunarSetu</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="wrap"><form class="auth card" id="f" novalidate><h1>Create account</h1><label for="name">Full name</label><input id="name" required minlength="2"><label for="role">I am a</label><select id="role"><option value="customer">Customer</option><option value="worker">Service professional</option></select>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="pw">Password (min 8 characters)</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required>
<p class="err" id="err" role="alert"></p><button class="btn" id="go">Create account</button>
<p>Already registered? <a href="login.html">Login</a></p></form></main>
<script type="module">
import{renderChrome,auth,db,A,F,getRole,home,toast}from"./js/app.js";renderChrome();
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
const msg=e=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"This email is already registered. Try logging in.","auth/weak-password":"Password must be at least 8 characters."}[e.code]||"Something went wrong. Please try again.");
f.onsubmit=async ev=>{ev.preventDefault();err.textContent="";const email=f.email.value.trim(),pw=f.pw.value;
 if(!/^\S+@\S+\.\S+$/.test(email)||pw.length<8){err.textContent="Enter a valid email and a password of at least 8 characters.";return}
 go.disabled=true;try{const q=new URLSearchParams(location.search);if(q.get("role")==="worker")document.getElementById("role").value="worker";const role=document.getElementById("role").value,name=document.getElementById("name").value.trim();if(name.length<2)throw{code:"x"};const c=await A.createUserWithEmailAndPassword(auth,email,pw);
 await F.setDoc(F.doc(db,"users",c.user.uid),{name,email,role,createdAt:F.serverTimestamp()});await A.sendEmailVerification(c.user);location.href=home(role)}catch(e){err.textContent=msg(e);go.disabled=false}};
</script></body></html>
