
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - HunarSetu</title>
  <link rel="stylesheet" href="./styles.css">

  <style>
    .dashboard-wrap {
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .dashboard-header h1 {
      margin: 0;
    }

    .dashboard-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: #166534;
      color: white;
      text-decoration: none;
      display: inline-block;
    }

    .dashboard-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .booking-list {
      display: grid;
      gap: 16px;
    }

    .booking-item {
      background: var(--card, #fff);
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 20px;
      overflow-wrap: anywhere;
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .booking-item h2 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .booking-item p {
      margin: 9px 0;
      line-height: 1.5;
    }

    .booking-status {
      display: inline-block;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 700;
      background: #f3f4f6;
      color: #374151;
      text-transform: capitalize;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-rejected {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .booking-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .booking-actions a {
      text-decoration: none;
    }

    .empty-state,
    .message-box {
      padding: 22px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: var(--card, #fff);
      text-align: center;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .dashboard-wrap {
        padding: 12px;
      }

      .booking-item {
        padding: 16px;
      }

      .dashboard-header {
        align-items: stretch;
      }

      .dashboard-header .dashboard-btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard-wrap">
    <header class="dashboard-header">
      <div>
        <h1>My Bookings</h1>
        <p>Track your service requests on HunarSetu.</p>
      </div>

      <button id="refreshBtn" class="dashboard-btn" type="button">
        Refresh
      </button>
    </header>

    <div id="message" class="message-box" role="status">
      Checking your account...
    </div>

    <section id="bookingList" class="booking-list"></section>

    <p style="margin-top:24px;">
      <a href="./workers.html">← Find Workers</a>
      &nbsp; | &nbsp;
      <a href="./index.html">Home</a>
    </p>
  </main>

  <script type="module">
    import { auth, db, F, getRole } from "./app.js";

    const message = document.getElementById("message");
    const bookingList = document.getElementById("bookingList");
    const refreshBtn = document.getElementById("refreshBtn");

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function formatDate(value) {
      if (!value) return "Not available";

      let date;

      if (typeof value === "string") {
        // Service dates are stored as YYYY-MM-DD.
        const parts = value.split("-");
        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return value;
      }

      if (typeof value.toDate === "function") {
        date = value.toDate();
      } else {
        date = new Date(value);
      }

      if (Number.isNaN(date.getTime())) {
        return "Not available";
      }

      return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    function createBookingCard(booking) {
      const card = document.createElement("article");
      card.className = "booking-item";

      const top = document.createElement("div");
      top.className = "booking-top";

      const heading = document.createElement("div");

      addText(
        heading,
        "h2",
        booking.workerName || "Service Provider"
      );

      addText(
        heading,
        "p",
        booking.workerSkill || "Service"
      );

      const status = document.createElement("span");
      const statusValue = booking.status || "pending";

      status.className =
        "booking-status status-" + statusValue;

      status.textContent =
        statusValue.charAt(0).toUpperCase() +
        statusValue.slice(1);

      top.append(heading, status);
      card.appendChild(top);

      addText(
        card,
        "p",
        "Service date: " + formatDate(booking.serviceDate)
      );

      addText(
        card,
        "p",
        "Address: " + (booking.address || "Not provided")
      );

      addText(
        card,
        "p",
        "Work details: " + (booking.description || "Not provided")
      );

      addText(
        card,
        "p",
        "Booking created: " + formatDate(booking.createdAt),
        "muted"
      );

      const actions = document.createElement("div");
      actions.className = "booking-actions";

      if (booking.phone) {
        const callLink = document.createElement("a");
        callLink.className = "dashboard-btn";
        callLink.href = "tel:" + booking.phone;
        callLink.textContent = "Call Worker";
        actions.appendChild(callLink);
      }

      if (booking.phone) {
        const whatsappLink = document.createElement("a");
        const number = booking.phone.replace(/\D/g, "");

        whatsappLink.className = "dashboard-btn";
        whatsappLink.href =
          "https://wa.me/" + number;
        whatsappLink.target = "_blank";
        whatsappLink.rel = "noopener noreferrer";
        whatsappLink.textContent = "WhatsApp";

        actions.appendChild(whatsappLink);
      }

      if (actions.childElementCount > 0) {
        card.appendChild(actions);
      }

      return card;
    }

    async function loadBookings(user) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Loading...";
      bookingList.replaceChildren();
      showMessage("Loading your bookings...");

      try {
        const bookingsQuery = F.query(
          F.collection(db, "bookings"),
          F.where("customerUid", "==", user.uid)
        );

        const snapshot = await F.getDocs(bookingsQuery);

        if (snapshot.empty) {
          showMessage("You haven't booked any services yet.");

          const empty = document.createElement("div");
          empty.className = "empty-state";

          addText(
            empty,
            "p",
            "Find a worker and book your first service."
          );

          const link = document.createElement("a");
          link.href = "./workers.html";
          link.className = "dashboard-btn";
          link.textContent = "Find Workers";

          empty.appendChild(link);
          bookingList.appendChild(empty);
          return;
        }

        const bookings = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        bookings.sort((a, b) => {
          const timeA = a.createdAt?.toMillis?.() || 0;
          const timeB = b.createdAt?.toMillis?.() || 0;
          return timeB - timeA;
        });

        message.hidden = true;

        bookings.forEach(booking => {
          bookingList.appendChild(createBookingCard(booking));
        });
      } catch (error) {
        console.error(error);

        showMessage(
          error.code === "permission-denied"
            ? "You don't have permission to view these bookings. Please check your Firestore rules."
            : "Could not load bookings. Please check your internet connection and try again."
        );
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    }

    F.onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showMessage("Please log in to view your bookings.");

        const link = document.createElement("a");
        link.href = "./login.html";
        link.className = "dashboard-btn";
        link.textContent = "Login";

        message.appendChild(document.createElement("br"));
        message.appendChild(document.createElement("br"));
        message.appendChild(link);

        bookingList.replaceChildren();
        refreshBtn.disabled = true;
        return;
      }

      try {
        const role = await getRole(user);

        if (role !== "customer") {
          showMessage(
            "This dashboard is for customer accounts. Please log in with a customer account."
          );
          bookingList.replaceChildren();
          refreshBtn.disabled = true;
          return;
        }

        refreshBtn.disabled = false;
        await loadBookings(user);

        refreshBtn.onclick = () => loadBookings(user);
      } catch (error) {
        console.error(error);
        showMessage("Could not verify your account. Please try again.");
      }
    });
  </script>
</body>
</html>
