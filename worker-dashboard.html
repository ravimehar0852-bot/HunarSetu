<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Worker Dashboard — HunarSetu</title>

  <link rel="stylesheet" href="./styles.css" />

  <style>
    body { background: #f6f7fb; }

    .dashboard-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .welcome-box {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .welcome-box h1 { margin: 0 0 6px; font-size: 26px; }
    .welcome-box p { margin: 0; color: #d1d5db; }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .stat-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px;
    }
    .stat-label { font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
    .stat-value { font-size: 20px; font-weight: 700; }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.available { background: #22c55e; }
    .dot.working { background: #f59e0b; }
    .dot.offline { background: #6b7280; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 28px 0 14px;
    }
    .section-title h2 { margin: 0; font-size: 21px; }

    .booking-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }
    .booking-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .booking-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .booking-id { font-size: 11px; color: #9ca3af; word-break: break-all; }

    .status {
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .status.pending { background: #fff7ed; color: #c2410c; }
    .status.confirmed { background: #eff6ff; color: #1d4ed8; }
    .status.working { background: #fff7ed; color: #b45309; }
    .status.completion_requested { background: #f5f3ff; color: #6d28d9; }
    .status.completed { background: #ecfdf5; color: #047857; }
    .status.rejected { background: #fef2f2; color: #b91c1c; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .detail { background: #f9fafb; border-radius: 12px; padding: 10px 12px; }
    .detail small { display: block; color: #6b7280; font-size: 11px; margin-bottom: 3px; }
    .detail strong { display: block; color: #111827; font-size: 14px; word-break: break-word; }

    .description { background: #f9fafb; border-radius: 12px; padding: 12px; margin-bottom: 15px; }
    .description strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .description p { margin: 0; color: #4b5563; font-size: 14px; line-height: 1.5; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-primary { background: #111827; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-warning { background: #f59e0b; color: #111827; }
    .btn-light { background: #f3f4f6; color: #111827; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .waiting-box {
      background: #faf5ff;
      color: #6d28d9;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .empty {
      background: #fff;
      border: 1px dashed #d1d5db;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      color: #6b7280;
    }
    .loading { text-align: center; padding: 30px; color: #6b7280; }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .refresh-btn { background: #fff; border: 1px solid #e5e7eb; color: #111827; }

    @media (max-width: 700px) {
      .profile-stats { grid-template-columns: 1fr; }
      .details { grid-template-columns: 1fr; }
      .booking-top { flex-direction: column; }
      .status { align-self: flex-start; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>

<body>

  <div class="dashboard-wrap">

    <div class="welcome-box">

      <h1>Worker Dashboard 👷</h1>

      <p id="welcomeText">
        Loading your dashboard...
      </p>

      <div class="availability" id="availabilityBox">
        <span class="dot offline"></span>
        <span>Checking status...</span>
      </div>

      <div class="profile-stats">

        <div class="stat-box">
          <div class="stat-label">Completed Tasks</div>
          <div class="stat-value" id="completedTasks">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Experience</div>
          <div class="stat-value" id="experience">—</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Current Requests</div>
          <div class="stat-value" id="requestCount">0</div>
        </div>

      </div>

    </div>

    <div id="errorBox"></div>

    <div class="section-title">

      <h2>My Booking Requests</h2>

      <button class="btn refresh-btn" id="refreshBtn">
        🔄 Refresh
      </button>

    </div>

    <div id="bookingList">
      <div class="loading">Loading bookings...</div>
    </div>

  </div>


  <script type="module">

    import {
      auth,
      db,
      A,
      F,
      getRole
    } from "./app.js";


    const bookingList = document.getElementById("bookingList");
    const welcomeText = document.getElementById("welcomeText");
    const completedTasksEl = document.getElementById("completedTasks");
    const experienceEl = document.getElementById("experience");
    const requestCountEl = document.getElementById("requestCount");
    const availabilityBox = document.getElementById("availabilityBox");
    const errorBox = document.getElementById("errorBox");
    const refreshBtn = document.getElementById("refreshBtn");


    let currentUser = null;
    let currentProfile = null;
    let busyBooking = null;
    let presenceTimer = null;


    function showError(message) {
      errorBox.innerHTML = `
        <div class="error">
          ${escapeHtml(message)}
        </div>
      `;
    }


    function showSuccess(message) {
      errorBox.innerHTML = `
        <div class="success">
          ${escapeHtml(message)}
        </div>
      `;
    }


    function clearMessage() {
      errorBox.innerHTML = "";
    }


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function formatDate(value) {

      if (!value) {
        return "—";
      }

      try {

        if (value && typeof value.toDate === "function") {
          return value.toDate().toLocaleString("en-IN");
        }

        return new Date(value).toLocaleString("en-IN");

      } catch {

        return "—";

      }

    }


    function statusText(status) {

      const map = {
        pending: "Pending Request",
        confirmed: "Accepted",
        working: "Working",
        completion_requested: "Completion Requested",
        completed: "Completed",
        rejected: "Rejected"
      };

      return map[status] || status || "Unknown";

    }


    function renderAvailability(status) {

      let dotClass = "offline";
      let text = "Offline";

      if (status === "working") {
        dotClass = "working";
        text = "Working";
      }

      else if (status === "available") {
        dotClass = "available";
        text = "Available";
      }

      availabilityBox.innerHTML = `
        <span class="dot ${dotClass}"></span>
        <span>${text}</span>
      `;

    }


    async function loadWorkerProfile() {

      if (!currentUser) {
        return;
      }

      try {

        const ref = F.doc(db, "workerProfiles", currentUser.uid);

        const snap = await F.getDoc(ref);

        if (!snap.exists()) {
          throw new Error("Worker profile not found.");
        }

        currentProfile = snap.data();

        welcomeText.textContent =
          `Welcome, ${currentProfile.name || currentUser.email || "Worker"}!`;

        completedTasksEl.textContent =
          Number(currentProfile.completedTasks || 0);

        experienceEl.textContent =
          currentProfile.experience
            ? `${currentProfile.experience} yrs`
            : "—";

        renderAvailability(currentProfile.availability || "available");

      } catch (error) {

        console.error(error);

        showError(
          "Worker profile load nahi ho saka. Please refresh karke try karo."
        );

      }

    }


    async function updatePresence(availability = null) {

      if (!currentUser) {
        return;
      }

      try {

        const profileRef = F.doc(db, "workerProfiles", currentUser.uid);

        const data = {
          lastActiveAt: F.serverTimestamp()
        };

        if (availability) {
          data.availability = availability;
        }

        await F.updateDoc(profileRef, data);

      } catch (error) {

        console.log("Presence update:", error);

      }

    }


    async function syncAvailability(bookings) {

      if (!currentUser) {
        return;
      }

      const workingJob = bookings.some(
        booking =>
          booking.status === "working" ||
          booking.status === "completion_requested"
      );

      const availability = workingJob ? "working" : "available";

      renderAvailability(availability);

      await updatePresence(availability);

    }


    async function loadBookings() {

      if (!currentUser) {
        return;
      }

      clearMessage();

      bookingList.innerHTML = `
        <div class="loading">
          Loading bookings...
        </div>
      `;

      try {

        const q = F.query(
          F.collection(db, "bookings"),
          F.where("workerUid", "==", currentUser.uid),
          F.orderBy("createdAt", "desc")
        );

        const snap = await F.getDocs(q);

        const bookings = [];

        snap.forEach(docSnap => {
          bookings.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        requestCountEl.textContent =
          bookings.filter(
            b =>
              b.status === "pending" ||
              b.status === "confirmed" ||
              b.status === "working" ||
              b.status === "completion_requested"
          ).length;

        await syncAvailability(bookings);

        renderBookings(bookings);

      } catch (error) {

        console.error("BOOKINGS LOAD ERROR:", error);

        bookingList.innerHTML = `
          <div class="empty">
            Bookings load nahi ho pa rahi hain.
          </div>
        `;

        showError(
          "Bookings load karte waqt error aaya. Firestore rules/index check karna hoga."
        );

      }

    }


    function renderBookings(bookings) {

      if (!bookings.length) {

        bookingList.innerHTML = `
          <div class="empty">

            <div style="font-size:36px;margin-bottom:10px;">
              📭
            </div>

            <strong>
              Abhi koi booking request nahi hai.
            </strong>

            <div style="margin-top:6px;">
              Customer booking karega to yahan request dikhegi.
            </div>

          </div>
        `;

        return;

      }

      bookingList.innerHTML =
        bookings.map(booking => renderBookingCard(booking)).join("");

      document.querySelectorAll("[data-action]").forEach(button => {

        button.addEventListener("click", async () => {

          const action = button.dataset.action;
          const bookingId = button.dataset.id;

          await handleAction(action, bookingId, button);

        });

      });

    }


    function renderBookingCard(booking) {

      const status = booking.status || "pending";

      let actions = "";

      if (status === "pending") {

        actions = `
          <button
            class="btn btn-success"
            data-action="accept"
            data-id="${escapeHtml(booking.id)}"
          >
            ✅ Accept Booking
          </button>

          <button
            class="btn btn-danger"
            data-action="reject"
            data-id="${escapeHtml(booking.id)}"
          >
            ❌ Reject
          </button>
        `;

      }

      else if (status === "confirmed") {

        actions = `
          <button
            class="btn btn-warning"
            data-action="start"
            data-id="${escapeHtml(booking.id)}"
          >
            🟠 Start Work
          </button>
        `;

      }

      else if (status === "working") {

        actions = `
          <button
            class="btn btn-primary"
            data-action="completion"
            data-id="${escapeHtml(booking.id)}"
          >
            📩 Request Completion
          </button>
        `;

      }

      else if (status === "completion_requested") {

        actions = `
          <div class="waiting-box">
            ⏳ Completion request Admin ke paas bhej di gayi hai.
            Admin confirmation ke baad job Completed hogi.
          </div>
        `;

      }

      else if (status === "completed") {

        actions = `
          <div
            class="waiting-box"
            style="background:#ecfdf5;color:#047857;border-color:#a7f3d0;"
          >
            ✅ Job successfully completed.
          </div>
        `;

      }

      else if (status === "rejected") {

        actions = `
          <div
            class="waiting-box"
            style="background:#fef2f2;color:#b91c1c;border-color:#fecaca;"
          >
            ❌ Ye booking reject kar di gayi hai.
          </div>
        `;

      }

      const phone = booking.phone || "Not provided";

      const phoneButton =
        booking.phone
          ? `
            <a
              class="btn btn-light"
              href="tel:${escapeHtml(booking.phone)}"
            >
              📞 Call Customer
            </a>
          `
          : "";

      const whatsappButton =
        booking.phone
          ? `
            <a
              class="btn btn-light"
              target="_blank"
              rel="noopener"
              href="https://wa.me/${encodeURIComponent(
                String(booking.phone).replace(/\D/g, "")
              )}"
            >
              💬 WhatsApp
            </a>
          `
          : "";

      return `
        <div class="booking-card">

          <div class="booking-top">

            <div>
              <div class="booking-title">
                ${escapeHtml(booking.customerName || "Customer")}
              </div>

              <div class="booking-id">
                Booking ID: ${escapeHtml(booking.id)}
              </div>
            </div>

            <span class="status ${escapeHtml(status)}">
              ${escapeHtml(statusText(status))}
            </span>

          </div>


          <div class="details">

            <div class="detail">
              <small>Service</small>
              <strong>
                ${escapeHtml(
                  booking.workerSkill ||
                  currentProfile?.skill ||
                  "Service"
                )}
              </strong>
            </div>

            <div class="detail">
              <small>Service Date</small>
              <strong>
                ${escapeHtml(booking.serviceDate || "Not specified")}
              </strong>
            </div>

            <div class="detail">
              <small>Phone</small>
              <strong>${escapeHtml(phone)}</strong>
            </div>

            <div class="detail">
              <small>Email</small>
              <strong>
                ${escapeHtml(booking.customerEmail || "Not provided")}
              </strong>
            </div>

            <div class="detail">
              <small>Booking Created</small>
              <strong>
                ${escapeHtml(formatDate(booking.createdAt))}
              </strong>
            </div>

            <div class="detail">
              <small>Address</small>
              <strong>
                ${escapeHtml(booking.address || "Not provided")}
              </strong>
            </div>

          </div>


          ${
            booking.description
              ? `
                <div class="description">
                  <strong>Customer Requirement</strong>
                  <p>${escapeHtml(booking.description)}</p>
                </div>
              `
              : ""
          }


          <div class="actions">

            ${actions}

            ${
              status !== "rejected" && status !== "completed"
                ? phoneButton + whatsappButton
                : ""
            }

          </div>

        </div>
      `;

    }


    async function handleAction(action, bookingId, button) {

      if (!currentUser) {
        showError("Please login karke dobara try karo.");
        return;
      }

      if (busyBooking) {
        return;
      }

      busyBooking = bookingId;

      if (button) {
        button.disabled = true;
      }

      clearMessage();

      try {

        const role = await getRole(currentUser);

        if (role !== "worker") {
          throw new Error("Only worker can update this booking.");
        }

        const bookingRef = F.doc(db, "bookings", bookingId);

        const bookingSnap = await F.getDoc(bookingRef);

        if (!bookingSnap.exists()) {
          throw new Error("Booking nahi mili.");
        }

        const booking = bookingSnap.data();

        if (booking.workerUid !== currentUser.uid) {
          throw new Error("Ye booking aapke liye nahi hai.");
        }

        let updateData = {};

        /*
          ACCEPT
          pending -> confirmed
        */

        if (action === "accept") {

          if (booking.status !== "pending") {
            throw new Error("Ye booking ab pending nahi hai.");
          }

          updateData = {
            status: "confirmed",
            acceptedByWorkerUid: currentUser.uid,
            acceptedAt: F.serverTimestamp()
          };

        }

        /*
          REJECT
          pending -> rejected
        */

        else if (action === "reject") {

          if (booking.status !== "pending") {
            throw new Error("Ye booking ab pending nahi hai.");
          }

          const ok = confirm(
            "Kya aap is booking ko reject karna chahte ho?"
          );

          if (!ok) {
            busyBooking = null;

            if (button) {
              button.disabled = false;
            }

            return;
          }

          updateData = {
            status: "rejected",
            rejectedByWorkerUid: currentUser.uid,
            rejectedAt: F.serverTimestamp()
          };

        }

        /*
          START WORK
          confirmed -> working
        */

        else if (action === "start") {

          if (booking.status !== "confirmed") {
            throw new Error("Pehle booking accept karo.");
          }

          updateData = {
            status: "working",
            startedAt: F.serverTimestamp()
          };

        }

        /*
          REQUEST COMPLETION
          working -> completion_requested
        */

        else if (action === "completion") {

          if (booking.status !== "working") {
            throw new Error("Work status Working hona chahiye.");
          }

          const ok = confirm(
            "Kya aap Admin ko work completion request bhejna chahte ho?"
          );

          if (!ok) {
            busyBooking = null;

            if (button) {
              button.disabled = false;
            }

            return;
          }

          updateData = {
            status: "completion_requested",
            completionRequestedAt: F.serverTimestamp()
          };

        }

        else {

          throw new Error("Invalid booking action.");

        }

        /*
          IMPORTANT:
          Sirf required fields update honge.
        */

        await F.updateDoc(bookingRef, updateData);

        if (action === "accept") {

          await updatePresence("available");

          showSuccess("Booking successfully accept ho gayi. ✅");

        }

        else if (action === "reject") {

          await updatePresence("available");

          showSuccess("Booking reject kar di gayi. ❌");

        }

        else if (action === "start") {

          await updatePresence("working");

          showSuccess("Work started successfully. 🛠️");

        }

        else if (action === "completion") {

          await updatePresence("working");

          showSuccess("Completion request Admin ko bhej di gayi. 📩");

        }

        await loadWorkerProfile();

        await loadBookings();

      } catch (error) {

        console.error("BOOKING UPDATE ERROR:", error);

        let message = "Booking update nahi ho saki.";

        if (error?.code === "permission-denied") {

          message =
            "Firestore permission denied. Rules me worker booking update allow nahi hai.";

        }

        else if (error?.code === "failed-precondition") {

          message = "Firestore precondition/index problem aa rahi hai.";

        }

        else if (error?.message) {

          message = error.message;

        }

        showError(message);

        await loadBookings();

      }

      busyBooking = null;

      if (button) {
        button.disabled = false;
      }

    }


    refreshBtn.addEventListener("click", async () => {

      clearMessage();

      await loadWorkerProfile();

      await loadBookings();

    });


    A.onAuthStateChanged(auth, async user => {

      if (!user) {

        window.location.href =
          "./login.html?next=./worker-dashboard.html";

        return;

      }

      currentUser = user;

      try {

        const role = await getRole(currentUser);

        if (role !== "worker") {

          showError("Worker account required.");

          return;

        }

        await loadWorkerProfile();

        await loadBookings();

        /*
          Presence heartbeat
        */

        if (presenceTimer) {
          clearInterval(presenceTimer);
        }

        presenceTimer = setInterval(async () => {
          await updatePresence();
        }, 60000);

      } catch (error) {

        console.error(error);

        showError("Dashboard load nahi ho saka.");

      }

    });

  </script>

</body>
</html>
