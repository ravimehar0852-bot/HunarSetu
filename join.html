<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join as a Worker — HunarSetu</title>
  <meta name="description" content="Register as a local service professional on HunarSetu.">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="wrap">
    <section class="sec">
      <h1>Join as a Worker</h1>
      <p class="mut">
        Create your professional profile on HunarSetu.
        Your profile will be reviewed before it becomes public.
      </p>

      <form class="card" id="workerForm" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required minlength="2">

        <label for="skill">Main skill</label>
        <select id="skill" name="skill" required>
          <option value="">Select your skill</option>
          <option value="Electrician">Electrician</option>
          <option value="Plumber">Plumber</option>
          <option value="Carpenter">Carpenter</option>
          <option value="Painter">Painter</option>
          <option value="AC Repair">AC Repair</option>
          <option value="Appliance Repair">Appliance Repair</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Beautician">Beautician</option>
          <option value="Tailor">Tailor</option>
          <option value="Tutor">Tutor</option>
          <option value="Other">Other</option>
        </select>

        <label for="area">Locality / Area</label>
        <input id="area" name="area" placeholder="e.g. Civil Lines" required>

        <label for="city">City</label>
        <input id="city" name="city" value="Jhalawar" required>

        <label for="exp">Years of experience</label>
        <input id="exp" name="exp" type="number"
          min="0" max="60" inputmode="numeric" value="0" required>

        <label for="phone">Mobile number</label>
        <input id="phone" name="phone" type="tel"
          inputmode="numeric" maxlength="10"
          autocomplete="tel" placeholder="10-digit mobile number" required>

        <label for="desc">About your work</label>
        <textarea id="desc" name="desc" rows="4"
          maxlength="1000" placeholder="Describe your skills and services" required></textarea>

        <p class="err" id="error" role="alert"></p>

        <button class="btn" id="submitBtn" type="submit">
          Submit Profile
        </button>

        <p class="ok" id="success" role="status" hidden>
          Your profile has been submitted for review.
        </p>
      </form>
    </section>
  </main>

  <script type="module">
    import {
      renderChrome,
      auth,
      db,
      F
    } from "./app.js";

    renderChrome();

    const form = document.getElementById("workerForm");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      errorBox.textContent = "";
      successBox.hidden = true;

      const user = auth.currentUser;

      if (!user) {
        errorBox.textContent =
          "Please log in before submitting your worker profile.";
        return;
      }

      const name = form.name.value.trim();
      const skill = form.skill.value;
      const area = form.area.value.trim();
      const city = form.city.value.trim();
      const experience = Number(form.exp.value);
      const phone = form.phone.value.trim();
      const description = form.desc.value.trim();

      if (name.length < 2) {
        errorBox.textContent = "Enter your full name.";
        return;
      }

      if (!skill || !area || !city) {
        errorBox.textContent =
          "Please complete all required fields.";
        return;
      }

      if (!Number.isInteger(experience) ||
          experience < 0 || experience > 60) {
        errorBox.textContent =
          "Enter experience between 0 and 60 years.";
        return;
      }

      if (!/^[6-9]\d{9}$/.test(phone)) {
        errorBox.textContent =
          "Enter a valid 10-digit Indian mobile number.";
        return;
      }

      if (description.length < 10) {
        errorBox.textContent =
          "Please describe your work in at least 10 characters.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        const userRef = F.doc(db, "users", user.uid);
        const userSnap = await F.getDoc(userRef);

        if (!userSnap.exists()) {
          throw new Error(
            "Your account profile was not found. Please log in again."
          );
        }

        if (userSnap.data().role !== "worker") {
          throw new Error(
            "This account is registered as a Customer. Please use a Service Professional account."
          );
        }

        const workerRef = F.doc(
          db,
          "workerProfiles",
          user.uid
        );

        const workerSnap = await F.getDoc(workerRef);

        if (workerSnap.exists()) {
          throw new Error(
            "A worker profile already exists for this account."
          );
        }

        await F.setDoc(workerRef, {
          uid: user.uid,
          name,
          email: user.email || "",
          skill,
          area,
          city,
          experience,
          phone,
          description,
          status: "pending",
          createdAt: F.serverTimestamp()
        });

        form.reset();
        successBox.hidden = false;
        successBox.focus();
        submitBtn.textContent = "Profile Submitted";

      } catch (error) {
        console.error("Worker profile error:", error);

        if (error.code === "permission-denied") {
          errorBox.textContent =
            "Permission denied. Please check the Firestore Rules.";
        } else {
          errorBox.textContent =
            error.message || "Could not submit your profile.";
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Profile";
      }
    });
  </script>
</body>
  </html>
