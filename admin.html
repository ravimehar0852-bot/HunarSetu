<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | HunarSetu</title>
  <link rel="stylesheet" href="./styles.css">

  <style>
    :root {
      --admin-bg: #f5f7fb;
      --admin-card: #ffffff;
      --admin-text: #172033;
      --admin-muted: #64748b;
      --admin-border: #e2e8f0;
      --admin-primary: #2563eb;
      --admin-green: #15803d;
      --admin-red: #dc2626;
      --admin-orange: #c2410c;
    }

    body {
      background: var(--admin-bg);
      color: var(--admin-text);
      margin: 0;
    }

    .admin-container {
      width: min(1100px, 94%);
      margin: 28px auto;
      padding-bottom: 40px;
    }

    .admin-heading {
      margin-bottom: 22px;
    }

    .admin-heading h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 5vw, 34px);
    }

    .admin-heading p {
      color: var(--admin-muted);
      margin: 0;
    }

    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .admin-tab {
      border: 1px solid var(--admin-border);
      background: white;
      color: var(--admin-text);
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-tab.active {
      background: var(--admin-primary);
      border-color: var(--admin-primary);
      color: white;
    }

    .admin-section {
      display: none;
    }

    .admin-section.active {
      display: block;
    }

    .admin-list {
      display: grid;
      gap: 16px;
    }

    .admin-card {
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.04);
    }

    .admin-card h3 {
      margin: 0 0 8px;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .admin-card p {
      margin: 7px 0;
      color: #475569;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .admin-card strong {
      color: var(--admin-text);
    }

    .admin-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 10px;
      margin: 5px 0 12px;
      font-size: 12px;
      font-weight: 800;
      background: #e2e8f0;
      color: #334155;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-completion_requested {
      background: #ffedd5;
      color: #9a3412;
    }

    .status-completed,
    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .admin-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--admin-primary);
    }

    .admin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .admin-btn.success {
      background: var(--admin-green);
    }

    .admin-btn.danger {
      background: var(--admin-red);
    }

    .admin-btn.warning {
      background: var(--admin-orange);
    }

    .admin-message {
      background: white;
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 18px;
      color: var(--admin-muted);
    }

    .admin-notice {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .admin-top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .admin-container {
        width: 92%;
        margin-top: 20px;
      }

      .admin-card {
        padding: 15px;
      }

      .admin-btn {
        flex: 1 1 140px;
      }
    }
  </style>
</head>

<body>
  <main class="admin-container">
    <header class="admin-heading">
      <h1>Admin Dashboard</h1>
      <p>Manage worker applications and customer bookings.</p>
    </header>

    <div class="admin-notice">
      <strong>Completion workflow:</strong>
      Jab worker completion request bhejega, booking yahan
      <strong>Completion Requested</strong> status mein dikhegi.
      Work verify karne ke baad hi Confirm Completed karein.
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="bookings">
        Bookings
      </button>

      <button class="admin-tab" data-tab="workers">
        Worker Applications
      </button>
    </div>

    <div class="admin-top-actions">
      <button class="admin-btn" id="refreshBtn" type="button">
        Refresh
      </button>
    </div>

    <section class="admin-section active" id="bookingsSection">
      <div class="admin-list" id="bookingsList">
        <div class="admin-message">Loading bookings...</div>
      </div>
    </section>

    <section class="admin-section" id="workersSection">
      <div class="admin-list" id="workersList">
        <div class="admin-message">Loading worker applications...</div>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      A,
      F,
      renderChrome,
      getRole
    } from "./app.js";

    const bookingsList = document.getElementById("bookingsList");
    const workersList = document.getElementById("workersList");
    const refreshBtn = document.getElementById("refreshBtn");

    let currentUser = null;
    let busy = false;

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function prettyStatus(status = "pending") {
      const labels = {
        pending: "Pending",
        confirmed: "Confirmed",
        completion_requested: "Completion Requested",
        completed: "Completed",
        rejected: "Rejected",
        approved: "Approved",
        active: "Active"
      };

      return labels[status] || status.replaceAll("_", " ");
    }

    function statusBadge(status = "pending") {
      const safeStatus = escapeHTML(status);
      return `
        <span class="admin-badge status-${safeStatus}">
          ${escapeHTML(prettyStatus(status))}
        </span>
      `;
    }

    function showMessage(container, message) {
      container.innerHTML = `
        <div class="admin-message">${escapeHTML(message)}</div>
      `;
    }

    function formatDate(value) {
      if (!value) return "Not available";

      try {
        const date = typeof value.toDate === "function"
          ? value.toDate()
          : new Date(value);

        if (Number.isNaN(date.getTime())) return "Not available";

        return date.toLocaleString("en-IN", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch {
        return "Not available";
      }
    }

    async function updateBookingStatus(bookingId, newStatus) {
      if (!currentUser || busy) return;

      const messages = {
        confirmed: "Is booking ko confirm karna hai?",
        rejected: "Is booking ko reject karna hai?",
        completed: "Kya aapne work verify kar liya hai aur booking complete karni hai?",
        review: "Booking ko wapas Confirmed karna hai? Worker dobara completion request bhej sakega."
      };

      const confirmation = messages[newStatus] || "Continue?";

      if (!window.confirm(confirmation)) return;

      busy = true;
      refreshBtn.disabled = true;

      try {
        const finalStatus = newStatus === "review" ? "confirmed" : newStatus;

        await F.updateDoc(
          F.doc(F.collection(F.getFirestore ? F.getFirestore() : undefined, "bookings"), bookingId),
          { status: finalStatus }
        );

        alert("Booking status updated successfully.");
        await loadBookings();
      } catch (error) {
        console.error("Booking update error:", error);
        alert(
          error.code === "permission-denied"
            ? "Permission denied. Please check Firestore Rules."
            : "Booking update failed. Please try again."
        );
      } finally {
        busy = false;
        refreshBtn.disabled = false;
      }
    }

    async function updateBooking(bookingId, newStatus) {
      if (!currentUser || busy) return;

      const messages = {
        confirmed: "Is booking ko confirm karna hai?",
        rejected: "Is booking ko reject karna hai?",
        completed: "Kya aap work verify karke booking complete karna chahte hain?",
        review: "Booking ko wapas Confirmed karna hai? Worker dobara completion request bhej sakega."
      };

      if (!window.confirm(messages[newStatus] || "Continue?")) return;

      busy = true;
      refreshBtn.disabled = true;

      try {
        const finalStatus = newStatus === "review" ? "confirmed" : newStatus;
        const bookingRef = F.doc(db, "bookings", bookingId);

        await F.updateDoc(bookingRef, {
          status: finalStatus
        });

        alert("Booking status updated successfully.");
        await loadBookings();
      } catch (error) {
        console.error(error);
        alert(
          error.code === "permission-denied"
            ? "Permission denied. Firestore Rules check karein."
            : "Update failed. Please try again."
        );
      } finally {
        busy = false;
        refreshBtn.disabled = false;
      }
    }

    async function loadBookings() {
      if (!currentUser) return;

      showMessage(bookingsList, "Loading bookings...");

      try {
        const snapshot = await F.getDocs(
          F.query(F.collection(db, "bookings"))
        );

        if (snapshot.empty) {
          showMessage(bookingsList, "Abhi koi booking nahi hai.");
          return;
        }

        const bookings = snapshot.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));

        bookings.sort((a, b) => {
          const timeA = a.createdAt?.toMillis?.() || 0;
          const timeB = b.createdAt?.toMillis?.() || 0;
          return timeB - timeA;
        });

        bookingsList.innerHTML = bookings.map(booking => {
          const status = booking.status || "pending";

          let actions = "";

          if (status === "pending") {
            actions = `
              <button class="admin-btn success"
                data-booking-action="confirmed"
                data-id="${escapeHTML(booking.id)}">
                Confirm Booking
              </button>

              <button class="admin-btn danger"
                data-booking-action="rejected"
                data-id="${escapeHTML(booking.id)}">
                Reject Booking
              </button>
            `;
          } else if (status === "completion_requested") {
            actions = `
              <button class="admin-btn success"
                data-booking-action="completed"
                data-id="${escapeHTML(booking.id)}">
                Confirm Completed
              </button>

              <button class="admin-btn warning"
                data-booking-action="review"
                data-id="${escapeHTML(booking.id)}">
                Review Again
              </button>
            `;
          } else if (status === "confirmed") {
            actions = `
              <button class="admin-btn success"
                data-booking-action="completed"
                data-id="${escapeHTML(booking.id)}">
                Mark Completed
              </button>

              <button class="admin-btn danger"
                data-booking-action="rejected"
                data-id="${escapeHTML(booking.id)}">
                Reject Booking
              </button>
            `;
          }

          return `
            <article class="admin-card">
              <h3>${escapeHTML(booking.customerName || "Customer")}</h3>
              ${statusBadge(status)}

              <p><strong>Service:</strong> ${escapeHTML(booking.workerSkill || "Not specified")}</p>
              <p><strong>Worker:</strong> ${escapeHTML(booking.workerName || "Not specified")}</p>
              <p><strong>Customer email:</strong> ${escapeHTML(booking.customerEmail || "Not provided")}</p>
              <p><strong>Phone:</strong> ${escapeHTML(booking.phone || "Not provided")}</p>
              <p><strong>Address:</strong> ${escapeHTML(booking.address || "Not provided")}</p>
              <p><strong>Service date:</strong> ${escapeHTML(booking.serviceDate || "Not specified")}</p>
              <p><strong>Description:</strong> ${escapeHTML(booking.description || "No description")}</p>
              <p><strong>Booking created:</strong> ${escapeHTML(formatDate(booking.createdAt))}</p>

              ${
                status === "completion_requested"
                  ? `<p><strong>Completion requested:</strong> ${escapeHTML(formatDate(booking.completionRequestedAt))}</p>`
                  : ""
              }

              <div class="admin-actions">${actions}</div>
            </article>
          `;
        }).join("");

      } catch (error) {
        console.error("Load bookings error:", error);
        showMessage(bookingsList, "Bookings load nahi hui. Firestore Rules check karein.");
      }
    }

    async function updateWorkerStatus(workerId, status) {
      if (!currentUser || busy) return;

      const message = status === "approved"
        ? "Is worker application ko approve karna hai?"
        : "Is worker application ko reject karna hai?";

      if (!window.confirm(message)) return;

      busy = true;
      refreshBtn.disabled = true;

      try {
        await F.updateDoc(F.doc(db, "workerProfiles", workerId), {
          status
        });

        alert(status === "approved" ? "Worker approved." : "Worker rejected.");
        await loadWorkers();
      } catch (error) {
        console.error("Worker update error:", error);
        alert(
          error.code === "permission-denied"
            ? "Permission denied. Firestore Rules check karein."
            : "Worker status update nahi hua."
        );
      } finally {
        busy = false;
        refreshBtn.disabled = false;
      }
    }

    async function loadWorkers() {
      if (!currentUser) return;

      showMessage(workersList, "Loading worker applications...");

      try {
        const snapshot = await F.getDocs(
          F.query(F.collection(db, "workerProfiles"))
        );

        const workers = snapshot.docs
          .map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }))
          .filter(worker => worker.status === "pending");

        if (!workers.length) {
          showMessage(workersList, "Koi pending worker application nahi hai.");
          return;
        }

        workersList.innerHTML = workers.map(worker => `
          <article class="admin-card">
            <h3>${escapeHTML(worker.name || "Worker")}</h3>
            ${statusBadge(worker.status || "pending")}

            <p><strong>Skill:</strong> ${escapeHTML(worker.skill || "Not specified")}</p>
            <p><strong>Area:</strong> ${escapeHTML(worker.area || "Not specified")}</p>
            <p><strong>City:</strong> ${escapeHTML(worker.city || "Not specified")}</p>
            <p><strong>Experience:</strong> ${escapeHTML(worker.experience || "Not specified")}</p>
            <p><strong>Phone:</strong> ${escapeHTML(worker.phone || "Not provided")}</p>
            <p><strong>Email:</strong> ${escapeHTML(worker.email || "Not provided")}</p>
            <p><strong>Description:</strong> ${escapeHTML(worker.description || "No description")}</p>

            <div class="admin-actions">
              <button class="admin-btn success"
                data-worker-action="approved"
                data-id="${escapeHTML(worker.id)}">
                Approve Worker
              </button>

              <button class="admin-btn danger"
                data-worker-action="rejected"
                data-id="${escapeHTML(worker.id)}">
                Reject Worker
              </button>
            </div>
          </article>
        `).join("");

      } catch (error) {
        console.error("Load workers error:", error);
        showMessage(workersList, "Worker applications load nahi hui. Firestore Rules check karein.");
      }
    }

    document.querySelectorAll(".admin-tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        document.querySelectorAll(".admin-section").forEach(section => {
          section.classList.toggle(
            "active",
            section.id === `${button.dataset.tab}Section`
          );
        });
      });
    });

    bookingsList.addEventListener("click", event => {
      const button = event.target.closest("[data-booking-action]");
      if (!button) return;

      updateBooking(button.dataset.id, button.dataset.bookingAction);
    });

    workersList.addEventListener("click", event => {
      const button = event.target.closest("[data-worker-action]");
      if (!button) return;

      updateWorkerStatus(button.dataset.id, button.dataset.workerAction);
    });

    refreshBtn.addEventListener("click", async () => {
      await Promise.all([loadBookings(), loadWorkers()]);
    });

    let db;

    A.onAuthStateChanged(A.getAuth ? A.getAuth() : undefined, async user => {
      if (!user) {
        window.location.href = "./login.html";
        return;
      }

      try {
        currentUser = user;

        const role = await getRole(user);

        if (role !== "admin") {
          alert("Admin access required.");
          window.location.href = "./index.html";
          return;
        }

        db = F.getFirestore ? F.getFirestore() : undefined;

        if (typeof renderChrome === "function") {
          renderChrome(user, role);
        }

        await Promise.all([loadBookings(), loadWorkers()]);
      } catch (error) {
        console.error("Admin initialization error:", error);
        showMessage(bookingsList, "Admin dashboard initialize nahi ho paya.");
      }
    });
  </script>
</body>
</html>
