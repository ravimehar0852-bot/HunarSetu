<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login — HunarSetu</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <main class="wrap">

    <div class="auth card">

      <h1>Login</h1>

      <p>
        HunarSetu par login karke service book karein.
      </p>

      <!-- =========================
           EMAIL LOGIN
      ========================== -->

      <form id="emailForm" novalidate>

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="example@gmail.com"
          required
        >

        <label for="pw">
          Password
        </label>

        <input
          id="pw"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <p
          class="err"
          id="err"
          role="alert"
        ></p>

        <button
          class="btn"
          id="go"
          type="submit"
        >
          Login
        </button>

      </form>


      <p>
        New here?

        <a
          id="createAccountLink"
          href="./register.html"
        >
          Create an account
        </a>

        ·

        <a href="./forgot-password.html">
          Forgot password?
        </a>
      </p>

    </div>

  </main>


  <script type="module">

    import {
      renderChrome,
      auth,
      db,
      A,
      F,
      home
    } from "./app.js";


    renderChrome();


    // =========================================
    // ELEMENTS
    // =========================================

    const emailForm =
      document.getElementById("emailForm");

    const errorBox =
      document.getElementById("err");

    const submitBtn =
      document.getElementById("go");


    // =========================================
    // RETURN / SELECTED SERVICE
    // =========================================

    const params =
      new URLSearchParams(location.search);

    const next =
      params.get("next");


    function getSafeNext() {

      if (!next) {
        return null;
      }

      try {

        const url =
          new URL(
            next,
            window.location.origin
          );

        // External website ko redirect nahi karna
        if (
          url.origin !==
          window.location.origin
        ) {
          return null;
        }

        return (
          url.pathname +
          url.search +
          url.hash
        );

      } catch {

        return null;

      }

    }


    const safeNext =
      getSafeNext();


    // =========================================
    // CREATE ACCOUNT LINK
    // =========================================

    const createAccountLink =
      document.getElementById(
        "createAccountLink"
      );


    if (safeNext) {

      createAccountLink.href =
        "./register.html?role=customer&next=" +
        encodeURIComponent(
          safeNext
        );

    }


    // =========================================
    // REDIRECT AFTER LOGIN
    // =========================================

    function redirectAfterLogin(role) {

      // Customer ne service select karke login kiya
      // to same selected service par wapas bhejo

      if (
        safeNext &&
        role === "customer"
      ) {

        window.location.href =
          safeNext;

      } else {

        window.location.href =
          home(role);

      }

    }


    // =========================================
    // ERROR MESSAGE
    // =========================================

    function errorMessage(error) {

      const messages = {

        "auth/invalid-credential":
          "Email ya password galat hai.",

        "auth/user-not-found":
          "Is email se account nahi mila.",

        "auth/wrong-password":
          "Password galat hai.",

        "auth/invalid-email":
          "Valid email address enter karo.",

        "auth/too-many-requests":
          "Bahut attempts hue hain. Thodi der baad try karo.",

        "auth/network-request-failed":
          "Internet connection check karo.",

        "auth/user-disabled":
          "Ye account disable hai.",

        "permission-denied":
          "Firestore permission issue hai. Firebase Rules check karo."

      };


      return (
        messages[error.code] ||
        error.message ||
        "Login nahi ho paya. Dobara try karo."
      );

    }


    // =========================================
    // EMAIL LOGIN
    // =========================================

    emailForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        errorBox.textContent = "";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("pw")
            .value;


        // =====================================
        // BASIC VALIDATION
        // =====================================

        if (!email || !password) {

          errorBox.textContent =
            "Email aur password dono enter karo.";

          return;

        }


        // =====================================
        // LOGIN BUTTON
        // =====================================

        submitBtn.disabled =
          true;

        submitBtn.textContent =
          "Logging in...";


        try {

          // ===================================
          // FIREBASE EMAIL LOGIN
          // ===================================

          const credential =
            await A.signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          // ===================================
          // USER PROFILE
          // ===================================

          const userRef =
            F.doc(
              db,
              "users",
              user.uid
            );


          const userSnap =
            await F.getDoc(
              userRef
            );


          let role;


          if (
            userSnap.exists()
          ) {

            role =
              userSnap.data().role;

          } else {

            // =================================
            // OLD ACCOUNT WITHOUT USER PROFILE
            // =================================

            const guessedName =
              user.displayName ||
              (
                user.email
                  ? user.email.split("@")[0]
                  : "Customer"
              );


            const name =
              guessedName.trim().length >= 2
                ? guessedName.trim()
                : "Customer";


            role =
              "customer";


            await F.setDoc(
              userRef,
              {
                uid: user.uid,
                name: name,
                email: user.email,
                role: role,
                emailVerified:
                  user.emailVerified,
                createdAt:
                  F.serverTimestamp()
              }
            );

          }


          // ===================================
          // CHECK ROLE
          // ===================================

          if (
            ![
              "customer",
              "worker",
              "admin"
            ].includes(role)
          ) {

            throw new Error(
              "Account role valid nahi hai. Support se contact karo."
            );

          }


          // ===================================
          // REDIRECT
          // ===================================

          redirectAfterLogin(
            role
          );


        } catch (error) {

          console.error(
            "Email login error:",
            error
          );


          errorBox.textContent =
            errorMessage(error);


          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
</html>
